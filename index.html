<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babs Crafts Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: left rail on desktop, bottom tab bar on phones. Home = numbers, Clients = folders, Studio = make the book. */
:root{
  --paper:#F6F5FB; --card:#FFFFFF; --ink:#1E1B3A; --muted:#66638A; --line:#E2E0F0;
  --accent:#3446E0; --accent-ink:#FFFFFF; --accent-soft:#E8EBFF;
  --pink:#FF5C8A; --yellow:#FFC93C; --mint:#1FB58F;
  --good:#17805A; --good-soft:#DDF4EA; --warn:#9A5B00; --warn-soft:#FFF0CC; --info-soft:#E8EBFF;
  --bar:#B9C0F5; --bar-now:#3446E0; --shadow:0 1px 2px rgba(30,27,58,.06),0 6px 20px rgba(30,27,58,.06);
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13112A; --card:#1C1A38; --ink:#F1EFFF; --muted:#A5A2CC; --line:#322F5E;
  --accent:#8C9AFF; --accent-ink:#13112A; --accent-soft:#2A2D66;
  --good:#5FD6A6; --good-soft:#18382F; --warn:#FFCB6B; --warn-soft:#3F3217; --info-soft:#2A2D66;
  --bar:#3B4090; --bar-now:#8C9AFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13112A; --card:#1C1A38; --ink:#F1EFFF; --muted:#A5A2CC; --line:#322F5E;
  --accent:#8C9AFF; --accent-ink:#13112A; --accent-soft:#2A2D66;
  --good:#5FD6A6; --good-soft:#18382F; --warn:#FFCB6B; --warn-soft:#3F3217; --info-soft:#2A2D66;
  --bar:#3B4090; --bar-now:#8C9AFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,44px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:max(16px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px var(--line)}
.mono img{width:100%;height:100%;display:block}
.brand b{font:700 18px/1.1 var(--display);display:block}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:20px;height:20px;flex:none}
nav.tabs button:hover{background:var(--accent-soft);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:700;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#C8372D;border-color:#E9B8B3}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.head{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-end}
.head p{max-width:52ch;color:var(--muted);margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--c,var(--accent))}
.stat .v{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.stat .s{font-size:12px;color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.chart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;align-items:end;height:190px;padding-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--bar);min-height:4px}
.bar.now i{background:var(--bar-now)}
.bar b{font-size:13px;font-variant-numeric:tabular-nums}
.bar span{font-size:11px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700}
th,td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right}
.scroll-x{overflow-x:auto}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.making{background:var(--info-soft);color:var(--accent)}
.pill.delivered{background:var(--warn-soft);color:var(--warn)}
.pill.pending{background:var(--line);color:var(--muted)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.ex{background:var(--line);color:var(--muted)}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.folder{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.folder::before{content:"";position:absolute;top:-9px;left:-1px;width:64px;height:10px;border-radius:8px 8px 0 0;background:var(--tab,var(--accent));border:1px solid var(--line);border-bottom:0}
.folder:hover{border-color:var(--accent)}
.folder .thumb{aspect-ratio:210/297;max-height:150px;width:auto;margin:0 auto;border-radius:4px;background:#fff;border:1px solid var(--line);display:block;object-fit:contain}
.folder .ph{height:150px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px}
.folder b{font:700 17px/1.2 var(--display)}
.folder .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:400;min-height:40px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.drop{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:16px;font-weight:700;cursor:pointer;color:var(--accent);background:var(--paper);text-align:center}
.drop:hover{border-color:var(--accent)}
.drop{position:relative}
.drop input,.ov{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
label.btn{position:relative;overflow:hidden}
.pg .bt{flex-wrap:wrap}.pg .bt .btn{flex:1 1 28%}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.ph-card{flex:none;width:118px;display:flex;flex-direction:column;gap:6px}
.ph-card img{width:118px;height:118px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pg{display:flex;flex-direction:column;gap:6px}
.pg.drag{opacity:.4}
.a4{position:relative;aspect-ratio:210/297;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.a4 img,.a4 canvas{width:100%;height:100%;display:block;object-fit:contain}
.a4 .n{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--paper);font:700 11px var(--body);padding:2px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.pg .bt{display:flex;gap:6px}
.pg .bt .btn{flex:1;padding:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.previews figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.previews .a4{width:100%;max-width:240px}
.note{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--info-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.good{background:var(--good-soft);color:var(--good)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px;border:2px dashed var(--line);border-radius:16px}
.checks{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--good-soft);color:var(--good)}
.dot.no{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.logo-prev{width:72px;height:72px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px}
  .rail{position:static}
  .rail .brand{padding-top:4px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:12px;padding:6px 10px;flex:1;align-items:center;text-align:center}
  .main{padding-bottom:84px}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand"><div class="mono" id="brandMono"></div><div><b id="brandName">Babs Crafts</b><span>Colouring book studio</span></div></div>
    <nav class="tabs" id="nav" aria-label="Sections"></nav>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

function niceDate(iso){if(!iso)return '';const d=new Date(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}

  req(store,mode,fn){return new Promise(res=>{if(!this.ok)return res(null);try{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true);t.onerror=()=>res(null);t.onabort=()=>res(null)}catch(e){res(null)}})},
  all(s){return this.req(s,'readonly',o=>o.getAll())},
  put(s,v){return this.req(s,'readwrite',o=>o.put(v))},

/* ---------- images ---------- */
const imgCache=new Map();
function loadImg(src,key){const k=key||src;if(imgCache.has(k))return imgCache.get(k);
  const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=src});imgCache.set(k,p);return p}
function loadEl(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src})}
function readURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(file)})}
function loadScript(u){return new Promise((res,rej)=>{if(document.querySelector('script[data-lib="'+u+'"]'))return res();const t=document.createElement('script');t.src=u;t.dataset.lib=u;t.onload=()=>res();t.onerror=()=>rej(new Error('script'));document.head.appendChild(t)})}
async function decodeFile(file){
  if(window.createImageBitmap){try{const bm=await createImageBitmap(file);return {src:bm,w:bm.width,h:bm.height}}catch(e){}}
  try{const u=URL.createObjectURL(file);try{const i=await loadEl(u);return {src:i,w:i.naturalWidth,h:i.naturalHeight}}finally{URL.revokeObjectURL(u)}}catch(e){}
  const i=await loadEl(await readURL(file));return {src:i,w:i.naturalWidth,h:i.naturalHeight}}
let heicP=null;
function loadHeic(){if(window.heic2any)return Promise.resolve();if(heicP)return heicP;
  heicP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';sc.onload=res;sc.onerror=()=>{heicP=null;rej(new Error('heic lib'))};document.head.appendChild(sc)});return heicP}
function readAsURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(file)})}
function urlToImg(u){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('bad image'));i.src=u})}
async function decodeFile(file){
  /* 1. normal photos and screenshots  2. big photos via the bitmap decoder  3. HEIC (iPhone, some Samsung) converted to JPEG */
  try{const u=await readAsURL(file);const i=await urlToImg(u);return i}catch(e){}
  try{if(window.createImageBitmap){const bm=await createImageBitmap(file);return bm}}catch(e){}
  await loadHeic();
  let out=await window.heic2any({blob:file,toType:'image/jpeg',quality:.9});if(Array.isArray(out))out=out[0];
  return await urlToImg(await readAsURL(out))}
async function fileToData(file,maxDim,q){
  const img=await decodeFile(file);const w=img.width,h=img.height;
  const s=Math.min(1,maxDim/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.imageSmoothingQuality='high';x.drawImage(img,0,0,cv.width,cv.height);if(img.close)try{img.close()}catch(e){}return cv.toDataURL('image/jpeg',q)}
const bboxCache=new Map();
async function bboxOf(src,key){if(bboxCache.has(key))return bboxCache.get(key);
  const img=await loadImg(src,key);const s=Math.min(1,500/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const p=(j*w+i)*4;if(d[p]<235||d[p+1]<235||d[p+2]<235){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}}
  let b={x:0,y:0,w:1,h:1};
  if(x1>=0&&(x1-x0)>8&&(y1-y0)>8){const px=Math.round(w*.015),py=Math.round(h*.015);x0=Math.max(0,x0-px);y0=Math.max(0,y0-py);x1=Math.min(w-1,x1+px);y1=Math.min(h-1,y1+py);b={x:x0/w,y:y0/h,w:(x1-x0+1)/w,h:(y1-y0+1)/h}}
  bboxCache.set(key,b);return b}
/* One A4 page: white sheet, even margin, image centred. trim = ignore empty white edges so every drawing fills the same area. */
async function renderPage(pg,width,fit,marginMm,trim){
  const cv=document.createElement('canvas');cv.width=width;cv.height=Math.round(width*297/210);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  const img=await loadImg(pg.src,pg.id);let sx=0,sy=0,sw=img.width,sh=img.height;
  if(trim){const b=await bboxOf(pg.src,pg.id);sx=b.x*img.width;sy=b.y*img.height;sw=b.w*img.width;sh=b.h*img.height}
  const m=marginMm/210*width,bw=cv.width-2*m,bh=cv.height-2*m;
  const sc=fit==='cover'?Math.max(bw/sw,bh/sh):Math.min(bw/sw,bh/sh);const dw=sw*sc,dh=sh*sc;
  x.save();x.beginPath();x.rect(m,m,bw,bh);x.clip();x.drawImage(img,sx,sy,sw,sh,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);x.restore();return cv}

/* quick outline (basic edge tracing; the AI redraw is a later step) */
async function makeOutline(src,detail){
  const img=await loadImg(src);const s=Math.min(1,1400/Math.max(img.width,img.height));const w=Math.round(img.width*s),h=Math.round(img.height*s);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let g=new Float32Array(w*h);for(let i=0;i<w*h;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  for(let pass=0;pass<3;pass++){const t=new Float32Array(w*h);for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const k=j*w+i;t[k]=(g[k-1]+g[k]+g[k+1]+g[k-w]+g[k+w]+g[k-w-1]+g[k-w+1]+g[k+w-1]+g[k+w+1])/9}g=t}
  const thr=64-detail*5;const out=x.createImageData(w,h);const o=out.data;const line=new Uint8Array(w*h);
  for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const k=j*w+i;
    const gx=-g[k-w-1]-2*g[k-1]-g[k+w-1]+g[k-w+1]+2*g[k+1]+g[k+w+1];const gy=-g[k-w-1]-2*g[k-w]-g[k-w+1]+g[k+w-1]+2*g[k+w]+g[k+w+1];
    if(Math.hypot(gx,gy)>thr)line[k]=1}
  for(let j=1;j<h-1;j++)for(let i=1;i<w-1;i++){const k=j*w+i;const on=line[k]||line[k-1]||line[k-w]?1:0;const v=on?35:255;o[k*4]=v;o[k*4+1]=v;o[k*4+2]=v+(on?20:0);o[k*4+3]=255}
  x.putImageData(out,0,0);return cv.toDataURL('image/jpeg',.92)}

/* sample line drawings so a fresh studio shows how pages look */
function sampleArt(kind){
  const cv=document.createElement('canvas');cv.width=900;cv.height=1200;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,1200);
  x.strokeStyle='#1E1B3A';x.lineWidth=7;x.lineJoin='round';x.lineCap='round';
  const circ=(cx,cy,r)=>{x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()};
  const ell=(cx,cy,rx,ry,a)=>{x.beginPath();x.ellipse(cx,cy,rx,ry,a,0,7);x.stroke()};
  if(kind==='flower'){for(let i=0;i<9;i++){const a=i/9*Math.PI*2;ell(450+Math.cos(a)*150,430+Math.sin(a)*150,95,50,a)}circ(450,430,70);circ(450,430,35);
    x.beginPath();x.moveTo(450,620);x.bezierCurveTo(420,800,480,900,450,1080);x.stroke();ell(360,860,90,38,-.6);ell(540,940,90,38,.6)}
  if(kind==='house'){x.strokeRect(220,560,460,380);x.beginPath();x.moveTo(190,560);x.lineTo(450,330);x.lineTo(710,560);x.closePath();x.stroke();x.strokeRect(400,740,100,200);x.strokeRect(270,640,90,90);x.strokeRect(540,640,90,90);
    circ(760,200,70);for(let i=0;i<10;i++){const a=i/10*Math.PI*2;x.beginPath();x.moveTo(760+Math.cos(a)*90,200+Math.sin(a)*90);x.lineTo(760+Math.cos(a)*130,200+Math.sin(a)*130);x.stroke()}
    x.beginPath();x.moveTo(60,940);x.lineTo(840,940);x.stroke()}
  if(kind==='star'){x.beginPath();for(let i=0;i<10;i++){const r=i%2?150:340,a=-Math.PI/2+i*Math.PI/5;x[i?'lineTo':'moveTo'](450+Math.cos(a)*r,560+Math.sin(a)*r)}x.closePath();x.stroke();
    for(let i=0;i<6;i++)circ(130+i*130,1000+(i%2)*40,36)}
  if(kind==='balloons'){[[330,380,150,'-.1'],[560,330,150,'.1'],[450,560,150,'0']].forEach(([cx,cy,r,a])=>{ell(cx,cy,r*.85,r,+a);x.beginPath();x.moveTo(cx-18,cy+r);x.lineTo(cx,cy+r+28);x.lineTo(cx+18,cy+r);x.stroke();x.beginPath();x.moveTo(cx,cy+r+28);x.bezierCurveTo(cx-40,cy+r+200,450+(cx-450)/3,900,450,1050);x.stroke()})}
  return cv.toDataURL('image/jpeg',.9)}

/* ---------- book pages (cover, gift page, back cover) ---------- */
const isDark=h=>{const n=parseInt(h.slice(1),16);const r=n>>16,g=(n>>8)&255,b=n&255;return (r*.299+g*.587+b*.114)<150};
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxW){const words=String(text).split(/\s+/).filter(Boolean);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function fontsReady(){try{await document.fonts.load('700 40px "Bricolage Grotesque"');await document.fonts.load('400 20px "DM Sans"')}catch(e){}}
async function logoBlock(x,cx,y,u,fg,st){ // publisher-style mark: logo with contact line below, y = top
  const h=24*u;const src=logoOf(st);
  try{const im=await loadImg(src,'logo:'+src.length);const w=im.width*(h/im.height);x.drawImage(im,cx-w/2,y,w,h)}catch(e){}
  let yy=y+h;x.fillStyle=fg;x.textAlign='center';x.textBaseline='alphabetic';
  const contact=[st.email,st.phone].filter(Boolean).join('   \u00b7   ');
  if(contact){yy+=5*u;x.globalAlpha=.85;x.font='400 '+(2.9*u)+'px "DM Sans",sans-serif';x.fillText(contact,cx,yy);x.globalAlpha=1}
  return yy}
async function drawCover(cv,c){
  await fontsReady();const x=cv.getContext('2d'),W=cv.width,H=cv.height,u=W/210;const col=c.coverColor||COVERS[0];const fg=isDark(col)?'#fff':'#1E1B3A';
  x.fillStyle=col;x.fillRect(0,0,W,H);x.strokeStyle=fg;x.globalAlpha=.55;x.lineWidth=.7*u;rr(x,9*u,9*u,W-18*u,H-18*u,5*u);x.stroke();x.globalAlpha=1;
  const title=(c.title||'Your title here').trim();x.fillStyle=fg;x.textAlign='center';x.textBaseline='alphabetic';
  let size=title.length>26?15:title.length>14?19:24;let lines;
  for(;;){x.font='700 '+(size*u)+'px "Bricolage Grotesque","DM Sans",sans-serif';lines=wrap(x,title,W-44*u);if(lines.length<=3||size<10)break;size-=1.5}
  let y=34*u+size*u*.5;lines.forEach((l,i)=>{x.fillText(l,W/2,y+i*size*u*1.08)});y+=(lines.length-1)*size*u*1.08;
  if(c.subtitle){y+=9*u;x.font='500 '+(5.2*u)+'px "DM Sans",sans-serif';x.globalAlpha=.9;const sl=wrap(x,c.subtitle,W-60*u);sl.slice(0,2).forEach((l,i)=>x.fillText(l,W/2,y+i*6.6*u));x.globalAlpha=1;y+=(Math.min(sl.length,2)-1)*6.6*u}
  const pg=c.pages.find(p=>p.id===c.coverPageId);
  if(pg){const top=Math.max(y+14*u,96*u),bh=H-top-22*u,bw=Math.min(W-60*u,bh*.74);const px=(W-bw)/2;
    x.save();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=8*u;x.shadowOffsetY=2*u;x.fillStyle='#fff';rr(x,px,top,bw,bh,4*u);x.fill();x.restore();
    const ph=await renderPage(pg,Math.round(bw),c.fit,6,c.trim);x.save();rr(x,px,top,bw,bh,4*u);x.clip();x.drawImage(ph,px,top+(bh-ph.height*(bw/ph.width))/2,bw,ph.height*(bw/ph.width));x.restore()}
  else{x.globalAlpha=.9;const sx=W/2-27*u;[['#FF5C8A',0],['#FFC93C',1],['#1FB58F',2]].forEach(([k,i])=>{if(isDark(col)&&k==='#FF5C8A'&&col===COVERS[0]){}x.fillStyle=k;x.beginPath();x.arc(sx+i*27*u,Math.max(y+26*u,150*u),7*u,0,7);x.fill()});x.globalAlpha=1}
}
async function drawInside(cv,st){await fontsReady();const x=cv.getContext('2d'),W=cv.width,H=cv.height,u=W/210;x.fillStyle='#fff';x.fillRect(0,0,W,H);await logoBlock(x,W/2,H-44*u,u,'#1E1B3A',st)}
async function drawBack(cv,c,st){await fontsReady();const x=cv.getContext('2d'),W=cv.width,H=cv.height,u=W/210;const col=c.coverColor||COVERS[0];const fg=isDark(col)?'#fff':'#1E1B3A';

/* ---------- numbers ---------- */
function costPer(){const s=S.settings;return (+s.costPrint||0)+(+s.costTransport||0)+(+s.costImages||0)+(+s.costPack||0)}
function dep(c){return c.depositPaidAt?Math.min(+c.depositAmount||0,+c.price||0):0}
function balanceDue(c){return c.status==='paid'?0:Math.max(0,(+c.price||0)-dep(c))}
function payments(c){const o=[];if(dep(c)>0)o.push({at:c.depositPaidAt,amt:dep(c)});if(c.status==='paid'&&c.paidAt)o.push({at:c.paidAt,amt:(+c.price||0)-dep(c)});return o}
function calc(){
  const now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1),w0=startOfWeek(now);const paid=S.clients.filter(c=>c.status==='paid'&&c.paidAt);
  const inRange=(c,a,b)=>{const d=new Date(c.paidAt);return d>=a&&d<b};
  const pays=S.clients.flatMap(payments);const cashIn=(a,b)=>pays.filter(p=>{const d=new Date(p.at);return d>=a&&d<b}).reduce((s,p)=>s+p.amt,0);
  const mPaid=paid.filter(c=>inRange(c,m0,new Date(8e15)));const wPaid=paid.filter(c=>inRange(c,w0,new Date(8e15)));
  const weeks=[];for(let i=7;i>=0;i--){const a=new Date(w0);a.setDate(a.getDate()-i*7);const b=new Date(a);b.setDate(b.getDate()+7);weeks.push({a,n:paid.filter(c=>inRange(c,a,b)).length,now:i===0})}
  const months=[];for(let i=0;i<6;i++){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,1);
    months.push({label:MON[a.getMonth()]+' '+a.getFullYear(),folders:S.clients.filter(c=>{const d=new Date(c.createdAt);return d>=a&&d<b}).length,sold:paid.filter(c=>inRange(c,a,b)).length,rev:cashIn(a,b)})}
  const bookRev=mPaid.reduce((s,c)=>s+(+c.price||0),0);
  return{folders:S.clients.length,newThisMonth:S.clients.filter(c=>new Date(c.createdAt)>=m0).length,weekSold:wPaid.length,monthSold:mPaid.length,rev:cashIn(m0,new Date(8e15)),profit:bookRev-mPaid.length*costPer(),weeks,months,
    pending:S.clients.filter(c=>c.status==='pending').length,making:S.clients.filter(c=>c.status==='making').length,delivered:S.clients.filter(c=>c.status==='delivered').length,paidAll:paid.length,
    owed:S.clients.filter(c=>c.status==='delivered').reduce((s,c)=>s+balanceDue(c),0),monthName:FULLMON[now.getMonth()]}}

/* ---------- AI redraw (OpenAI) ---------- */
const mem={};
function aiGet(k,d){try{const v=localStorage.getItem('babs.ai.'+k);return v==null?(mem[k]!=null?mem[k]:(d||'')):v}catch(e){return mem[k]!=null?mem[k]:(d||'')}}
function aiSet(k,v){mem[k]=v;try{v?localStorage.setItem('babs.ai.'+k,v):localStorage.removeItem('babs.ai.'+k)}catch(e){}try{if(v)Store.put('meta',{key:'ai.'+k,value:v});else Store.del('meta','ai.'+k)}catch(e){}}
const AI_PROMPT='Turn this photo into a colourable photo without altering anything else: keep the same people, faces, poses and scene. Redraw it as a clean colouring-book page. Keep every person\'s face, hair, age, expression and pose clearly recognisable and true to the photo. Use smooth, bold, even black outlines on a pure white background. No shading, no grey tones, no solid black areas, no textures and no text. Keep shapes simple with large, clear areas that are easy to colour with pencils or crayons. Simplify the background to a few light outlines of the main objects and leave the rest white. Keep everyone fully inside the frame with a little white margin.';
function dataToBlob(d){const m=/^data:([^;]+);base64,(.*)$/.exec(d);const bin=atob(m[2]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m[1]})}
async function aiRedraw(photoSrc){
  const key=aiGet('key');if(!key)throw {code:'nokey'};
  const model=aiGet('model','gpt-image-2'),quality=aiGet('quality','medium');const blob=dataToBlob(photoSrc);
  const call=async size=>{const fd=new FormData();fd.append('model',model);fd.append('prompt',AI_PROMPT);fd.append('size',size);fd.append('quality',quality);fd.append('output_format','png');fd.append('image[]',blob,'photo.jpg');
    let r;try{r=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd})}catch(e){throw {code:'network'}}
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok)throw {code:'http',status:r.status,msg:(j&&j.error&&j.error.message)||''};
    const b=j&&j.data&&j.data[0]&&j.data[0].b64_json;if(!b)throw {code:'empty'};return 'data:image/png;base64,'+b};
  let out;const want=model.indexOf('gpt-image-2')===0?'1024x1456':'1024x1536';
  try{out=await call(want)}catch(e){if(e.code==='http'&&e.status===400&&/size/i.test(e.msg)&&want!=='1024x1536')out=await call('1024x1536');else throw e}
  const img=await loadImg(out);const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0);return cv.toDataURL('image/jpeg',.93)}
function aiErr(e){
  if(e.code==='nokey')return 'Add your OpenAI key in Settings first.';
  if(e.code==='network')return 'AI redraw does not work from the Claude link. It only works from your own website copy of the studio. Quick outline still works here.';
  if(e.status===401)return 'OpenAI did not accept the key. Check it in Settings, or paste a new one.';
  if(e.status===403||e.status===404)return 'OpenAI will not let this account make images with this model yet. It may need credit added, or organisation verification. Try another model in Settings. '+(e.msg||'');
  if(e.status===429)return /quota|billing|credit|limit/i.test(e.msg)?'There is no credit on the OpenAI account. Add credit under Billing, then try again.':'OpenAI is busy. Wait a minute and try again.';
  if(e.status===400&&/safety|moderation|policy/i.test(e.msg))return 'OpenAI refused this photo (its safety check). Try another photo.';
  return 'OpenAI error'+(e.status?' '+e.status:'')+': '+(e.msg||e.code)}
async function aiRun(c,ids,redoPage){
  if(!aiGet('key')){toast('Add your OpenAI key in Settings first.');go('settings');return}
  S.busy=true;S.aiMsg='';S.ai={done:0,total:ids.length};render();let n=0,err='';
  for(const id of ids){const p=c.photos.find(x=>x.id===id);if(!p)continue;
    try{const src=await aiRedraw(p.src);

async function exportPdf(c){

    const W=1240,H=1754;const jobs=[];jobs.push(async cv=>drawCover(cv,c));if(c.gift)jobs.push(async cv=>drawInside(cv,S.settings));
    c.pages.forEach(p=>jobs.push(async cv=>{const r=await renderPage(p,W,c.fit,c.margin,c.trim);cv.getContext('2d').drawImage(r,0,0)}));
    if(c.back)jobs.push(async cv=>drawBack(cv,c,S.settings));
    for(let i=0;i<jobs.length;i++){const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);await jobs[i](cv);
      if(i)doc.addPage('a4','portrait');doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297,undefined,'FAST');
      if(bar)bar.style.width=Math.round((i+1)/jobs.length*100)+'%';if(note)note.textContent=`Building page ${i+1} of ${jobs.length}…`;await sleep(5)}
    const blob=doc.output('blob');const nameBase=((c.title||c.name)+' - '+c.name).replace(/[\\/:*?"<>|]+/g,'').trim()||'colouring book';

  }catch(e){if(note)note.textContent='Something went wrong while building the PDF. Try again, or remove very large pages.'}
  if(btn)btn.disabled=false;setTimeout(()=>{if(prog)prog.hidden=true},800)}

/* ---------- Google Drive ---------- */
let gTok=null,gExp=0,gsiP=null;
function gMsg(t){S.gStatus=t;const e=$('#gMsg');if(e)e.textContent=t}
function loadGsi(){if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();if(gsiP)return gsiP;
  gsiP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>{gsiP=null;rej({code:'network'})};document.head.appendChild(sc)});return gsiP}
function gToken(){
  if(gTok&&Date.now()<gExp-60000)return Promise.resolve(gTok);
  const cid=aiGet('gclient');if(!cid)return Promise.reject({code:'noclient'});
  return loadGsi().then(()=>new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',hint:S.settings.email||'',
      callback:r=>{if(r.error)return rej({code:'auth',msg:r.error});gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;res(gTok)},
      error_callback:e=>rej({code:'auth',msg:(e&&e.type)||'popup'})});
    tc.requestAccessToken({})}))}
async function gapi(url,opt){
  const t=await gToken();opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+t},opt.headers||{});
  let r;try{r=await fetch(url,opt)}catch(e){throw {code:'network'}}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}if(r.status===401)gTok=null;throw {code:'http',status:r.status,msg:m}}return r}
const DR='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files',FOLDER='application/vnd.google-apps.folder';
const qe=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");const pad2=n=>String(n).padStart(2,'0');
async function gFolder(name,parent){
  const q="name='"+qe(name)+"' and mimeType='"+FOLDER+"' and trashed=false"+(parent?" and '"+parent+"' in parents":'');
  const j=await (await gapi(DR+'?fields=files(id)&q='+encodeURIComponent(q))).json();if(j.files&&j.files[0])return j.files[0].id;
  const r=await gapi(DR+'?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:FOLDER,parents:parent?[parent]:undefined})});return (await r.json()).id}
async function gPut(name,blob,type,parent,id){
  const meta=id?{name}:{name,parents:[parent]};const b='bc'+Math.random().toString(36).slice(2);
  const body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify(meta),'\r\n--'+b+'\r\nContent-Type: '+type+'\r\n\r\n',blob,'\r\n--'+b+'--']);
  try{const r=await gapi((id?UP+'/'+id:UP)+'?uploadType=multipart&fields=id',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});return (await r.json()).id}
  catch(e){if(id&&e.status===404)return gPut(name,blob,type,parent,null);throw e}}
async function gRename(id,name){
  try{await gapi(DR+'/'+id+'?fields=id',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});return true}catch(e){if(e.status===404)return false;throw e}}
function detailsText(c){return ['Client: '+c.name,'Phone: '+(c.phone||'-'),'Email: '+(c.email||'-'),'Book title: '+(c.title||'-'),'Status: '+STATUS[c.status],'Price: '+ksh(c.price),'Deposit: '+ksh(dep(c))+'  (M-Pesa code '+(c.depositCode||'-')+')','Final payment M-Pesa code: '+(c.finalCode||'-'),'Notes: '+(c.notes||'-'),'Photos: '+c.photos.length+'    Colouring pages: '+c.pages.length,'Saved: '+new Date().toLocaleString()].join('\r\n')}
function gErr(e){
  if(e.code==='noclient')return 'Add your Google client ID first.';
  if(e.code==='network')return 'Could not reach Google. Check your connection and try again.';
  if(e.code==='auth')return /popup_closed|cancel|dismiss/i.test(e.msg||'')?'Sign-in was cancelled. Press the button again.':/access_denied/.test(e.msg||'')?'Google refused the sign-in. Make sure this Google account is added as a test user.':/popup_failed|blocked/i.test(e.msg||'')?'Your browser blocked the Google sign-in window. Allow pop-ups for this site, then try again.':'Google sign-in failed ('+(e.msg||'unknown')+').';
  if(e.status===403)return 'Google Drive refused this. Is the Google Drive API turned on in your Google Cloud project? '+(e.msg||'');
  if(e.status===401)return 'Google sign-in expired. Press the button again.';
  return 'Google Drive error'+(e.status?' '+e.status:'')+': '+(e.msg||e.code)}
async function driveBackup(real){
  if(S.gBusy)return;S.gBusy=true;gMsg('Signing in to Google…');
  try{
    await gToken();
    const who=await (await gapi('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();S.gUser=who.user&&who.user.emailAddress;
    const root=await gFolder('Babs Crafts Backups');let n=0;
    for(const c of real){
      gMsg('Saving '+c.name+' ('+(++n)+' of '+real.length+')…');
      c.drive=c.drive||{};const fl=c.drive.files=c.drive.files||{},nm=c.drive.names=c.drive.names||{};
      const fid=await gFolder(safeName(c.name)+' ('+String(c.id).slice(-4)+')',root);
      const ph=await gFolder('Photos',fid),pg=await gFolder('Pages',fid);
      const sync=async(list,prefix,parent)=>{for(let i=0;i<list.length;i++){const it=list[i],name=prefix+'-'+pad2(i+1)+'.jpg';
        if(fl[it.id]){if(nm[it.id]===name)continue;if(await gRename(fl[it.id],name)){nm[it.id]=name;continue}}
        fl[it.id]=await gPut(name,dataToBlob(it.src),'image/jpeg',parent);nm[it.id]=name;gMsg('Saving '+c.name+': '+prefix+' '+(i+1)+' of '+list.length+'…')}};
      await sync(c.photos,'photo',ph);await sync(c.pages,'page',pg);
      fl.details=await gPut('Client details.txt',new Blob([detailsText(c)],{type:'text/plain'}),'text/plain',fid,fl.details);
      await Store.put('clients',c)}
    gMsg('Saving the full backup file…');
    const full=JSON.stringify({app:'babs-crafts-studio',version:1,savedAt:new Date().toISOString(),settings:S.settings,clients:real});
    const id=await gPut('babs-crafts-backup.json',new Blob([full],{type:'application/json'}),'application/json',root,aiGet('gfull')||null);aiSet('gfull',id);
    S.lastBackup=new Date().toISOString();Store.put('meta',{key:'lastBackup',value:S.lastBackup});
    gMsg('Saved to Google Drive ('+(S.gUser||'your account')+') in the folder "Babs Crafts Backups".');toast('Saved to Google Drive.')}
  catch(e){const m=gErr(e);gMsg(m);toast(m)}
  S.gBusy=false;if(S.view==='settings'||S.view==='home')render()}
async function driveRestore(){
  if(S.gBusy)return;S.gBusy=true;gMsg('Signing in to Google…');
  try{await gToken();
    const q="name='babs-crafts-backup.json' and trashed=false";
    const j=await (await gapi(DR+'?orderBy='+encodeURIComponent('modifiedTime desc')+'&pageSize=1&fields=files(id)&q='+encodeURIComponent(q))).json();
    if(!j.files||!j.files[0]){gMsg('No backup found in this Google account. Sign in with the account you backed up to.');S.gBusy=false;return}
    gMsg('Restoring…');const t=await (await gapi(DR+'/'+j.files[0].id+'?alt=media')).text();aiSet('gfull',j.files[0].id);
    await restoreText(t);gMsg('Restored from Google Drive.')}
  catch(e){const m=gErr(e);gMsg(m);toast(m)}
  S.gBusy=false}
async function backup(mode){
  const real=S.clients.filter(c=>!c.example);if(!real.length){toast('There are no client folders to back up yet.');return}
  const text=JSON.stringify({app:'babs-crafts-studio',version:1,savedAt:new Date().toISOString(),settings:S.settings,clients:real});
  if(mode!=='download'&&aiGet('gclient'))return driveBackup(real);
  const name='babs-crafts-backup-'+dayStr(new Date().toISOString())+'.json';let done=false;
  if(mode!=='download'){try{const f=new File([text],name.replace(/\.json$/,'.txt'),{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Babs Crafts backup'});done=true}}
    catch(e){if(e&&e.name==='AbortError')return}}
  if(!done){if(!downloads){toast('This view cannot save files. Open the studio from your website link.');return}
    try{await downloads.save({filename:name,data:text});done=true}catch(e){if(!e||e.code!=='declined')toast('Could not save the backup.');return}}
  S.lastBackup=new Date().toISOString();Store.put('meta',{key:'lastBackup',value:S.lastBackup});render();toast(mode==='download'?'Backup file saved. Keep it somewhere safe, like Google Drive.':'Backup sent. Make sure you chose Google Drive or your email.')}
async function restore(file){try{await restoreText(await file.text())}catch(e){toast('That file is not a Babs Crafts backup.')}}
async function restoreText(text){
  try{const j=JSON.parse(text);if(!j||j.app!=='babs-crafts-studio'||!Array.isArray(j.clients))throw 0;
    for(const c of j.clients){const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0)S.clients[i]=c;else S.clients.push(c);await Store.put('clients',c)}
    if(j.settings){S.settings=Object.assign({},DEF,j.settings);saveSettings()}render();toast(j.clients.length+' folder'+(j.clients.length===1?'':'s')+' restored.')}
  catch(e){toast('That file is not a Babs Crafts backup.')}}

document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('.pg');if(!el)return;dragId=el.dataset.pid;el.classList.add('drag');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',()=>{dragId=null;$$('.pg.drag').forEach(x=>x.classList.remove('drag'))});
document.addEventListener('dragover',e=>{if(dragId&&e.target.closest&&e.target.closest('.pg'))e.preventDefault()});
document.addEventListener('drop',e=>{const el=e.target.closest&&e.target.closest('.pg');if(!el||!dragId)return;e.preventDefault();const c=getClient(S.studioId);if(!c)return;
  const from=c.pages.findIndex(p=>p.id===dragId),to=c.pages.findIndex(p=>p.id===el.dataset.pid);if(from<0||to<0||from===to)return;const [p]=c.pages.splice(from,1);c.pages.splice(to,0,p);saveClient(c);render()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','clients','studio','settings'].includes(h)&&h!==S.view){S.view=h;if(h!=='clients')S.openId=null;render()}});

/* ---------- start ---------- */
async function start(){
  const h=location.hash.slice(1);if(['home','clients','studio','settings'].includes(h))S.view=h;
  render();
  try{if(window.claude&&window.claude.use)downloads=await window.claude.use('downloads')}catch(e){downloads=null}
  if(!downloads)downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'}}};
  S.inClaude=!!(window.claude&&window.claude.use);if(S.inClaude)render();
  await Store.open();
  try{if(navigator.storage&&navigator.storage.persist)S.persisted=await navigator.storage.persist()}catch(e){}
  if(Store.ok){const cl=await Store.all('clients');if(Array.isArray(cl))S.clients=cl.map(migrate);const metas=await Store.all('meta');if(Array.isArray(metas)){metas.forEach(m=>{if(m&&typeof m.key==='string'&&m.key.indexOf('ai.')===0&&m.value){mem[m.key.slice(3)]=m.value;try{if(!localStorage.getItem('babs.ai.'+m.key.slice(3)))localStorage.setItem('babs.ai.'+m.key.slice(3),m.value)}catch(e){}}});const m=metas.find(x=>x.key==='settings');if(m)S.settings=Object.assign({},DEF,m.value);S._cleared=!!metas.find(x=>x.key==='examplesCleared');{const lb=metas.find(x=>x.key==='lastBackup');if(lb)S.lastBackup=lb.value}}}
  if(!S.clients.length&&!S._cleared){S.clients=seedExamples();S.examples=true;S.clients.forEach(c=>saveClient(c))}
  else S.examples=S.clients.some(c=>c.example);
  if(!Store.ok)toast('Saving is turned off in this window. Your work will not be kept after you close it.');
  if(aiGet('gclient'))loadGsi().catch(()=>{});
  render()}
start();
})();
</script>
